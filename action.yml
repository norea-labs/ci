name: Controlli Norea
description: Caratteri vietati nelle righe cambiate, forma del CLAUDE.md e nessuna skill di Claude dentro il repo.

inputs:
  base:
    description: Commit di partenza. Vuoto per controllare tutti i file.
    required: false
    default: ""
  escludi:
    description: Percorsi da non controllare per i caratteri vietati, uno per riga, nel formato pathspec di git.
    required: false
    default: ""
  skill-del-progetto:
    description: true nei repo dei progetti clienti, che possono tenere le skill di Claude che servono solo a quel progetto.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Controlli Norea
      shell: bash
      env:
        NOREA_BASE: ${{ inputs.base }}
        NOREA_ESCLUDI: ${{ inputs.escludi }}
        NOREA_SKILL_DEL_PROGETTO: ${{ inputs.skill-del-progetto }}
      run: |
        esito=0
        perl "$GITHUB_ACTION_PATH/script/caratteri-vietati.pl" || esito=1
        perl "$GITHUB_ACTION_PATH/script/claude-md.pl" "$GITHUB_ACTION_PATH/modello/claude-parte-fissa.md" || esito=1
        perl "$GITHUB_ACTION_PATH/script/skill-nel-plugin.pl" || esito=1
        exit $esito
